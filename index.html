<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>RIFT — slit-scan camera</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">

    <!-- Live camera preview + fixed centre slit guide -->
    <div id="live-view">
      <video id="camera" autoplay muted playsinline></video>
      <div id="slit-guide"></div>
      <div id="camera-message" class="message hidden"></div>
      <!-- Temporary SCAN-mode engineering diagnostics (v0.3 experiment). -->
      <div id="debug-overlay" class="hidden"></div>
    </div>

    <!-- Growing / final slit-scan image -->
    <div id="output-view">
      <canvas id="output-canvas"></canvas>
    </div>

    <!-- RATE: experimental control over output pixels/second (scan speed).
         See PORTING.md "RATE". -->
    <div id="rate-control">
      <!-- Capture mode: TIME = output advances with elapsed time (RATE);
           SCAN = output advances with measured camera pan (v0.3 experiment). -->
      <div id="mode-toggle">
        <button id="mode-time" class="active">TIME</button>
        <button id="mode-scan">SCAN</button>
      </div>
      <label for="rate-slider">RATE <span id="rate-value"></span></label>
      <input type="range" id="rate-slider" min="15" max="240" step="1">
    </div>

    <!-- Controls -->
    <div id="controls">
      <button id="scan-btn" disabled>SCAN</button>
      <button id="reset-btn" class="hidden">RESET</button>
      <a id="save-link" class="hidden" download="rift-scan.png">SAVE</a>
    </div>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
